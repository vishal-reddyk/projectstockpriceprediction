data:
  ticker: AAPL
  period: 5y
  interval: 1d
  auto_adjust: false

preprocess:
  window: 60
  train_split: 0.8

model:
  lstm_units: 50
  dropout: 0.2
  epochs: 5
  batch_size: 32
  validation_split: 0.1

retrain:
  comparison_split: 0.2

mlflow:
  experiment: aapl_lstm
  registered_model: AAPL_LSTM
  alias: champion
